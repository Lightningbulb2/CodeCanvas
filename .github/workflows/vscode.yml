# The VS Code extension: built and packaged on every change to vscode/, and released when a
# vscode-vX.Y.Z tag is pushed (the tag's message becomes the release notes).
name: VS Code extension

on:
  push:
    branches: [main]
    tags: ['vscode-v*']
    paths: ['vscode/**', '.github/workflows/vscode.yml']
  pull_request:
    paths: ['vscode/**', '.github/workflows/vscode.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - run: npm ci
      - name: Compile the extension host
        run: npm run compile
      - name: Check the webview scripts parse
        run: for f in media/webview/*.js test/*.js; do node --check "$f"; done
      - name: Package
        run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: codecanvas-vscode
          path: vscode/*.vsix
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/vscode-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the tag's message is the release notes
      - uses: actions/download-artifact@v4
        with:
          name: codecanvas-vscode
          path: dist
      - name: Check the tag matches the version in package.json
        run: |
          v=$(node -p "require('./vscode/package.json').version")
          if [ "${GITHUB_REF_NAME}" != "vscode-v$v" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match vscode/package.json version $v"; exit 1
          fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.vsix \
            --title "CodeCanvas for VS Code $VERSION" --notes-from-tag --verify-tag
